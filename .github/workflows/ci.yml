name: production-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./... -count=1
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - if: runner.os == 'Linux'
        run: go test ./skillv2 -run '^$' -fuzz FuzzParseGeneratedNeverPanics -fuzztime 10s
      - if: runner.os == 'Linux'
        run: go test ./skillv2 -run '^$' -fuzz FuzzRestoreRuntimeCheckpointNeverPanics -fuzztime 10s
      - run: go test ./... -run '^$' -bench . -benchmem -count=1

  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cube-skill
      - uses: actions/checkout@v4
        with:
          repository: tjbdwanghaibo/cube-core
          ref: v1.3.0
          path: cube-core
      - uses: actions/checkout@v4
        with:
          repository: tjbdwanghaibo/cube-kit
          ref: v1.1.0
          path: cube-kit
      - uses: actions/setup-go@v5
        with:
          go-version-file: cube-skill/integration/sync-e2e/go.mod
          cache-dependency-path: |
            cube-skill/go.sum
            cube-skill/integration/sync-e2e/go.sum
      - working-directory: cube-skill/integration/sync-e2e
        run: go test -race ./... -count=1

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The module path must resolve as a real repository, and a version tag
      # must match the module's major suffix — the two failure modes that made
      # v1.4.0-era roost-skill uninstallable (module pointed at a nonexistent
      # repo, and a v1 tag on a /v2 module path).
      - name: module path resolves
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          base=$(echo "$mod" | sed -E 's#/v[0-9]+$##')
          echo "module: $mod (repo: $base)"
          git ls-remote "https://${base}.git" HEAD
      - name: tag matches module major
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          tag=${GITHUB_REF#refs/tags/}
          major=$(echo "$tag" | sed -E 's#^v([0-9]+)\..*#\1#')
          suffix=$(echo "$mod" | grep -oE '/v[0-9]+$' | tr -d '/v' || true)
          if [ "$major" -ge 2 ]; then want="$major"; else want=""; fi
          if [ "${suffix:-}" != "${want}" ]; then
            echo "tag $tag requires module suffix '/v${want}' but go.mod has '${suffix:+/v$suffix}'"
            exit 1
          fi
